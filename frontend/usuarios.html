<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso Justo - Usuarios</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/usuarios.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-shoe-prints me-2"></i>Paso Justo
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html"><i class="fas fa-gift me-1"></i>Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="usuarios.html"><i class="fas fa-users me-1"></i>Usuarios</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12 d-flex justify-content-between align-items-center">
                <div>
                    <h1><i class="fas fa-users me-2"></i>Gestión de usuarios</h1>
                    <p class="lead">Administra los usuarios y sus puntos acumulados</p>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoUsuario">
                    <i class="fas fa-user-plus me-2"></i>Nuevo usuario
                </button>
            </div>
        </div>

        <!-- Mensaje de estado -->
        <div id="mensajeEstado" class="d-none"></div>

        <!-- Tabla de usuarios -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div id="usuarios-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando usuarios...</span>
                        </div>
                        <p class="mt-3">Cargando usuarios...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Nuevo usuario -->
    <div class="modal fade" id="modalNuevoUsuario" tabindex="-1" aria-labelledby="modalNuevoUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNuevoUsuarioLabel">
                        <i class="fas fa-user-plus me-2"></i>Agregar nuevo usuario
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoUsuario" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej: Rose González" required>
                            <div class="invalid-feedback">El nombre es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="correo" placeholder="Ej: rose@test.ac.cr" required>
                            <div class="invalid-feedback">Ingresa un correo válido.</div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="puntosDisponibles" class="form-label">Puntos disponibles</label>
                                <input type="number" class="form-control" id="puntosDisponibles" value="0" min="0">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="puntosCanjeados" class="form-label">Puntos canjeados</label>
                                <input type="number" class="form-control" id="puntosCanjeados" value="0" min="0">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="puntosTotales" class="form-label">Puntos totales</label>
                                <input type="number" class="form-control" id="puntosTotales" value="0" min="0">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarUsuario">
                        <i class="fas fa-save me-2"></i>Guardar usuario
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="js/usuarios.js"></script>

</body>

</html>
