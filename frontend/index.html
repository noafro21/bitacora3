<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso Justo</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hero {
            background: linear-gradient(135deg, #0d6efd 0%, #198754 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 40px;
        }

        .card-menu {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-menu:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="hero text-center">
        <div class="container">
            <h1 class="display-4 fw-bold"><i class="fas fa-star me-3"></i>Paso Justo</h1>
            <p class="lead">Sistema de puntos y canje de productos en comercios afiliados</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center g-4">
            <div class="col-md-5">
                <a href="productos.html" class="text-decoration-none">
                    <div class="card card-menu text-center p-4">
                        <div class="card-body">
                            <div class="card-icon text-success">
                                <i class="fas fa-gift"></i>
                            </div>
                            <h3 class="card-title">Productos</h3>
                            <p class="card-text text-muted">Ver los productos disponibles para canjear con tus puntos acumulados.</p>
                            <span class="btn btn-success mt-2">
                                <i class="fas fa-arrow-right me-2"></i>Ver productos
                            </span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-5">
                <a href="usuarios.html" class="text-decoration-none">
                    <div class="card card-menu text-center p-4">
                        <div class="card-body">
                            <div class="card-icon text-primary">
                                <i class="fas fa-users"></i>
                            </div>
                            <h3 class="card-title">Usuarios</h3>
                            <p class="card-text text-muted">Gestionar usuarios del sistema, consultar y actualizar sus puntos.</p>
                            <span class="btn btn-primary mt-2">
                                <i class="fas fa-arrow-right me-2"></i>Ver usuarios
                            </span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
